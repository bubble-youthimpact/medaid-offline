<style>
  /* Everything is scoped under .ntd-widget so this can never restyle
     the host page — Bubble's HTML element is not sandboxed, and a
     <style> tag applies document-wide regardless of where it sits in
     the DOM, so bare `body`, `html`, or `*` selectors would leak out. */

  .ntd-widget, .ntd-widget *{
    box-sizing: border-box;
  }

  .ntd-widget{
    --paper: #FFFFFF;
    --card: #FFFFFF;
    --ink: #2B2A28;
    --ink-soft: #63605A;
    --sage: #5D7F63;
    --sage-soft: #E4EBE2;
    --clay: #B5654F;
    --clay-soft: #F3E4DF;
    --maroon: #7A2E2E;
    --maroon-soft: #EFD9D8;
    --amber: #B9762F;
    --amber-soft: #F3E5D1;
    --gold: #A69433;
    --gold-soft: #F0ECD3;
    --purple: #77ac78;
    --line: #DEDAD0;
    --radius: 14px;

    /* urgency badge palette */
    --u-nonurgent-soft: #BFE1F6;
    --u-nonurgent-text: #1F5C7A;
    --u-semiurgent-soft: #D4EDBC;
    --u-semiurgent-text: #4B7A2F;
    --u-urgent-soft: #FFE5A0;
    --u-urgent-text: #8A6A1F;
    --u-emergency-soft: #FFC8AA;
    --u-emergency-text: #A6502A;
    --u-resus-soft: #FFCFC9;
    --u-resus-text: #A13A32;

    display: block;
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
    padding: 0;
    box-sizing: border-box;
    overflow-x: hidden;
    container-type: inline-size;
    container-name: ntd-root;
  }

  .ntd-widget .eyebrow{
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 4px;
  }

  .ntd-widget h1{
    font-size: 26px;
    font-weight: 600;
    margin: 0 0 14px;
    line-height: 1.25;
  }

  .ntd-widget .disclaimer{
    background: var(--maroon-soft);
    border: 1px solid var(--maroon);
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 13px;
    color: var(--ink);
    margin-bottom: 22px;
  }

  .ntd-widget .disclaimer strong{
    color: var(--maroon);
  }

  .ntd-widget .step-label{
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    margin: 0 0 4px;
  }

  .ntd-widget .step-instructions{
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 16px;
  }

  .ntd-widget .chip-group{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 8px;
  }

  .ntd-widget .chip{
    font-family: inherit;
    font-size: 14px;
    text-align: left;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
    color: var(--ink);
    max-width: 100%;
    overflow-wrap: break-word;
    word-break: break-word;
  }

  .ntd-widget .chip.selected{
    background: var(--purple);
    border-color: var(--purple);
    color: #fff;
  }

  .ntd-widget .symptom-group{
    margin-bottom: 18px;
  }

  .ntd-widget .symptom-group-title{
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    margin: 0 0 8px;
  }

  .ntd-widget .actions{
    margin-top: 20px;
    display:flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  .ntd-widget .btn,
  .ntd-widget .btn:hover,
  .ntd-widget .btn:focus,
  .ntd-widget .btn:active,
  .ntd-widget .btn:visited{
    font-family: inherit !important;
    font-size: 14px !important;
    border-radius: 10px !important;
    padding: 10px 16px !important;
    cursor: pointer !important;
    border: 1px solid var(--line) !important;
    background: var(--card) !important;
    background-color: var(--card) !important;
    color: var(--ink) !important;
    box-shadow: none !important;
    outline: none !important;
    -webkit-appearance: none;
    appearance: none;
    transition: none !important;
  }

  .ntd-widget .btn.primary,
  .ntd-widget .btn.primary:hover,
  .ntd-widget .btn.primary:focus,
  .ntd-widget .btn.primary:active,
  .ntd-widget .btn.primary:visited{
    background: var(--purple) !important;
    background-color: var(--purple) !important;
    border-color: var(--purple) !important;
    color: #fff !important;
    box-shadow: none !important;
  }

  .ntd-widget .btn:disabled{
    opacity: 0.4;
    cursor: default !important;
  }

  .ntd-widget .results-summary{
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 16px;
  }

  .ntd-widget .result-card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 12px;
  }

  .ntd-widget .result-head{
    display:flex;
    align-items:flex-start;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    min-width: 0;
  }

  .ntd-widget .result-name{
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    min-width: 0;
    overflow-wrap: break-word;
    word-break: break-word;
    flex: 1 1 auto;
  }

  .ntd-widget .urgency-pill{
    display:inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .ntd-widget .urgency-resuscitation{ background: var(--u-resus-soft); color: var(--u-resus-text); }
  .ntd-widget .urgency-emergency{ background: var(--u-emergency-soft); color: var(--u-emergency-text); }
  .ntd-widget .urgency-urgent{ background: var(--u-urgent-soft); color: var(--u-urgent-text); }
  .ntd-widget .urgency-semi{ background: var(--u-semiurgent-soft); color: var(--u-semiurgent-text); }
  .ntd-widget .urgency-non{ background: var(--u-nonurgent-soft); color: var(--u-nonurgent-text); }

  @container ntd-root (max-width: 480px){
    .ntd-widget .result-head{
      flex-direction: column;
      align-items: flex-start;
    }

    .ntd-widget .urgency-pill{
      order: -1;
    }
  }

  .ntd-widget .match-tag{
    font-size: 12px;
    color: var(--ink-soft);
    margin: 6px 0 0;
    overflow-wrap: break-word;
    word-break: break-word;
  }

  .ntd-widget details{
    margin-top: 10px;
    border-top: 1px solid var(--line);
    padding-top: 10px;
  }

  .ntd-widget details:first-of-type{
    margin-top: 12px;
  }

  .ntd-widget summary{
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    list-style: none;
  }

  .ntd-widget summary::-webkit-details-marker{ display:none; }

  .ntd-widget summary::before{
    content: "▸ ";
    color: var(--ink-soft);
  }

  .ntd-widget details[open] summary::before{
    content: "▾ ";
  }

  .ntd-widget .section-body{
    font-size: 14px;
    color: var(--ink);
    margin-top: 8px;
  }

  .ntd-widget .section-body p{
    margin: 0 0 10px;
  }

  .ntd-widget .section-body p:last-child{
    margin-bottom: 0;
  }

  .ntd-widget .section-body ul{
    margin: 0;
    padding-left: 18px;
  }

  .ntd-widget .section-body li{
    margin-bottom: 8px;
  }

  .ntd-widget .section-body li:last-child{
    margin-bottom: 0;
  }

  .ntd-widget .no-results{
    font-size: 14px;
    color: var(--ink-soft);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
  }

  .ntd-widget .save-note{
    font-size: 12px;
    color: var(--ink-soft);
  }
</style>

<div class="ntd-widget" id="ntd-root">

  <div id="ntd-step-symptom" style="display:none;"></div>

</div>

"categories": ["Muscular / Neurological", "Skin"], "symptoms": ["Skin Ulcers / Open Sores", "Rashes, Bumps, & Itching", "Bone & Limb Deformities"], "urgency": "Non-Urgent (Routine Checks)", "whatIsIt": ["A chronic bacterial infection caused by Treponema pallidum pertenue that primarily affects skin, bones, and cartilage, mainly in children in warm, humid tropical regions."], "doIHaveIt": ["Did you develop a single, raspberry-like skin sore (\"mother yaw\") that turned into a painless ulcer?", "Do you have widespread yellow-crusted skin bumps or painful swelling over your limb bones?", "Do you have painful bone or joint aches that cause a limping gait (\"crab yaws\")?"], "whatShouldIDo": ["Keep skin clean and cover open lesions to prevent transmission to playmates or family members through direct skin contact."], "whenToSeeDoctor": ["Visit a community health clinic for routine outpatient care; a single dose of oral azithromycin typically clears the infection completely."], "prevention": ["Maintain good personal hygiene by bathing regularly with clean water and soap.", "Avoid direct contact with open skin sores or lesions of infected individuals.", "Ensure all household members get treated promptly if a contact develops sores."]}];

  const CATEGORY_ORDER = ["Whole Body / Systemic", "Skin", "Stomach / Intestines", "Muscular / Neurological", "Vision / Eyes", "Maternal / Bleeding"];

  const URGENCY_RANK = {
    "Resuscitation (Immediate)": 0,
    "Emergency (Few Hours)": 1,
    "Urgent (24-48 Hours)": 2,
    "Semi-Urgent (1-2 Weeks)": 3,
    "Non-Urgent (Routine Checks)": 4
  };

  const URGENCY_CLASS = {
    "Resuscitation (Immediate)": "urgency-resuscitation",
    "Emergency (Few Hours)": "urgency-emergency",
    "Urgent (24-48 Hours)": "urgency-urgent",
    "Semi-Urgent (1-2 Weeks)": "urgency-semi",
    "Non-Urgent (Routine Checks)": "urgency-non"
  };

  let selectedCategories = new Set();
  let selectedSymptoms = new Set();

  const stepCategoryEl = document.getElementById("ntd-step-category");
  const stepSymptomEl = document.getElementById("ntd-step-symptom");
  const stepResultsEl = document.getElementById("ntd-step-results");

  function showStep(step){
    stepCategoryEl.style.display = step === "category" ? "" : "none";
    stepSymptomEl.style.display = step === "symptom" ? "" : "none";
    stepResultsEl.style.display = step === "results" ? "" : "none";
    document.getElementById("ntd-root").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function renderCategoryStep(){
    let html = `
      <p class="step-label">Step 1 of 3</p>
      <p class="step-instructions">Select every area that applies. You can select more than one, and tap again to deselect.</p>
      <div class="chip-group" id="ntd-category-chips"></div>
      <div class="actions">
        <button class="btn primary" id="ntd-to-symptoms" disabled>Next: choose symptoms</button>
      </div>
    `;
    stepCategoryEl.innerHTML = html;

    const chipGroup = document.getElementById("ntd-category-chips");
    CATEGORY_ORDER.forEach(cat => {
      const chip = document.createElement("button");
      chip.className = "chip";
      chip.textContent = cat;
      chip.addEventListener("click", () => {
        if(selectedCategories.has(cat)){
          selectedCategories.delete(cat);
          chip.classList.remove("selected");
        } else {
          selectedCategories.add(cat);
          chip.classList.add("selected");
        }
        document.getElementById("ntd-to-symptoms").disabled = selectedCategories.size === 0;
      });
      chipGroup.appendChild(chip);
    });

    document.getElementById("ntd-to-symptoms").addEventListener("click", () => {
      renderSymptomStep();
      showStep("symptom");
    });
  }

  function renderSymptomStep(){
    let html = `
      <p class="step-label">Step 2 of 3</p>
      <p class="step-instructions">Select every symptom that applies. Tap again to deselect.</p>
    `;

    CATEGORY_ORDER.filter(c => selectedCategories.has(c)).forEach(cat => {
      html += `
        <div class="symptom-group">
          <p class="symptom-group-title">${cat}</p>
          <div class="chip-group" data-category="${cat}"></div>
        </div>
      `;
    });

    html += `
      <div class="actions">
        <button class="btn" id="ntd-back-to-categories">Back</button>
        <button class="btn primary" id="ntd-to-results" disabled>See results</button>
      </div>
    `;

    stepSymptomEl.innerHTML = html;

    CATEGORY_ORDER.filter(c => selectedCategories.has(c)).forEach(cat => {
      const group = stepSymptomEl.querySelector(`.chip-group[data-category="${CSS.escape(cat)}"]`);
      (TAXONOMY[cat] || []).forEach(sym => {
        const chip = document.createElement("button");
        chip.className = "chip";
        if(selectedSymptoms.has(sym)) chip.classList.add("selected");
        chip.textContent = sym;
        chip.addEventListener("click", () => {
          if(selectedSymptoms.has(sym)){
            selectedSymptoms.delete(sym);
            chip.classList.remove("selected");
          } else {
            selectedSymptoms.add(sym);
            chip.classList.add("selected");
          }
          document.getElementById("ntd-to-results").disabled = selectedSymptoms.size === 0;
        });
        group.appendChild(chip);
      });
    });

    document.getElementById("ntd-to-results").disabled = selectedSymptoms.size === 0;

    document.getElementById("ntd-back-to-categories").addEventListener("click", () => {
      showStep("category");
    });

    document.getElementById("ntd-to-results").addEventListener("click", () => {
      renderResultsStep();
      showStep("results");
    });
  }

  function paragraphsHtml(paragraphs){
    return paragraphs.map(p => `<p>${escapeHtml(p)}</p>`).join("");
  }

  function listHtml(items){
    return `<ul>${items.map(i => `<li>${escapeHtml(i)}</li>`).join("")}</ul>`;
  }

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function renderResultsStep(){
    const matches = RECORDS.map(r => {
      const matchCount = r.symptoms.filter(s => selectedSymptoms.has(s)).length;
      return { record: r, matchCount };
    }).filter(m => m.matchCount > 0);

    matches.sort((a, b) => {
      if(b.matchCount !== a.matchCount) return b.matchCount - a.matchCount;
      const rankA = URGENCY_RANK[a.record.urgency] ?? 99;
      const rankB = URGENCY_RANK[b.record.urgency] ?? 99;
      if(rankA !== rankB) return rankA - rankB;
      return a.record.name.localeCompare(b.record.name);
    });

    let html = `
      <p class="step-label">Step 3 of 3</p>
      <p class="results-summary">${matches.length} possible match${matches.length === 1 ? "" : "es"} based on ${selectedSymptoms.size} selected symptom${selectedSymptoms.size === 1 ? "" : "s"}, sorted by closest match and urgency.</p>
    `;

    if(matches.length === 0){
      html += `<div class="no-results">No conditions in this list matched your selected symptoms. This doesn't rule anything out — if you're concerned, please check with a health worker or doctor.</div>`;
    } else {
      matches.forEach(m => {
        const r = m.record;
        const urgencyClass = URGENCY_CLASS[r.urgency] || "urgency-non";
        const matchedNames = r.symptoms.filter(s => selectedSymptoms.has(s));
        html += `
          <div class="result-card">
            <div class="result-head">
              <p class="result-name">${escapeHtml(r.name)}</p>
              <span class="urgency-pill ${urgencyClass}">${escapeHtml(r.urgency)}</span>
            </div>
            <p class="match-tag">Matches ${m.matchCount} of ${r.symptoms.length} listed symptoms: ${matchedNames.map(escapeHtml).join(", ")}</p>

            <details>
              <summary>What is it?</summary>
              <div class="section-body">${paragraphsHtml(r.whatIsIt)}</div>
            </details>

            <details>
              <summary>Do I have it?</summary>
              <div class="section-body">${listHtml(r.doIHaveIt)}</div>
            </details>

            <details>
              <summary>What should I do?</summary>
              <div class="section-body">${listHtml(r.whatShouldIDo)}</div>
            </details>

            <details>
              <summary>When to see a doctor?</summary>
              <div class="section-body">${paragraphsHtml(r.whenToSeeDoctor)}</div>
            </details>

            <details>
              <summary>Prevention</summary>
              <div class="section-body">${listHtml(r.prevention)}</div>
            </details>
          </div>
        `;
      });
    }

    html += `
      <div class="actions">
        <button class="btn" id="ntd-back-to-symptoms">Back</button>
        <button class="btn" id="ntd-start-over">Start over</button>
        <span class="save-note" id="ntd-save-note"></span>
      </div>
    `;

    stepResultsEl.innerHTML = html;

    document.getElementById("ntd-back-to-symptoms").addEventListener("click", () => {
      renderSymptomStep();
      showStep("symptom");
    });

    document.getElementById("ntd-start-over").addEventListener("click", resetAll);

    saveToDatabase(matches);
  }

  const NTD_QUEUE_KEY = "ntd_pending_selfchecks";

  // Reads whatever the app currently believes about connectivity.
  // Falls back to the standard browser API when running outside the
  // Nachocode-wrapped app (e.g. previewing the Bubble page in a browser).
  function isOnline(){
    if(window.Nachocode && typeof Nachocode.device !== "undefined" && typeof window.__ntdIsConnected === "boolean"){
      return window.__ntdIsConnected;
    }
    return navigator.onLine;
  }

  // Nachocode fires 'networkchanged' with { isConnected, connectionType }.
  // We track it in a plain variable since there's no synchronous getter.
  if(window.Nachocode && Nachocode.event){
    Nachocode.event.on("networkchanged", status => {
      window.__ntdIsConnected = !!status.isConnected;
      if(window.__ntdIsConnected) flushNtdQueue();
    });
    Nachocode.event.on("foreground", () => flushNtdQueue());
    Nachocode.event.on("init", () => flushNtdQueue());
  }

  function readQueue(callback){
    if(window.Nachocode && Nachocode.preference){
      Nachocode.preference.getData(NTD_QUEUE_KEY, data => {
        try{ callback(data ? JSON.parse(data) : []); }
        catch(e){ callback([]); }
      });
    } else {
      try{ callback(JSON.parse(localStorage.getItem(NTD_QUEUE_KEY) || "[]")); }
      catch(e){ callback([]); }
    }
  }

  function writeQueue(queue){
    const json = JSON.stringify(queue);
    if(window.Nachocode && Nachocode.preference){
      Nachocode.preference.setData(NTD_QUEUE_KEY, json);
    } else {
      localStorage.setItem(NTD_QUEUE_KEY, json);
    }
  }

  function sendOne(payload){
    if(!isOnline()) return false;
    if(typeof bubble_fn_saveNtdSelfCheck !== "function") return false;
    try{
      bubble_fn_saveNtdSelfCheck(JSON.stringify(payload));
      return true;
    } catch(err){
      return false;
    }
  }

  function flushNtdQueue(){
    readQueue(queue => {
      if(!queue.length) return;
      const remaining = queue.filter(item => !sendOne(item));
      writeQueue(remaining);
    });
  }

  function saveToDatabase(matches){
    const payload = {
      categories: Array.from(selectedCategories),
      symptoms: Array.from(selectedSymptoms),
      matches: matches.map(m => ({ name: m.record.name, urgency: m.record.urgency, matchCount: m.matchCount })),
      timestamp: new Date().toISOString()
    };

    const noteEl = document.getElementById("ntd-save-note");

    // Hook point: this calls into Bubble via the Toolbox plugin's
    // bubble_fn_ bridge. Define bubble_fn_saveNtdSelfCheck in a Bubble
    // workflow ("An external JavaScript action is called") to receive
    // this payload and create a database record from it.
    if(sendOne(payload)){
      if(noteEl) noteEl.textContent = "Saved.";
      flushNtdQueue(); // also clear out anything left over from a prior offline session
    } else {
      readQueue(queue => {
        queue.push(payload);
        writeQueue(queue);
        if(noteEl) noteEl.textContent = "Saved locally — will sync when you're back online.";
      });
    }
  }

  function resetAll(){
    selectedCategories = new Set();
    selectedSymptoms = new Set();
    renderCategoryStep();
    showStep("category");
  }

  renderCategoryStep();
  showStep("category");
  flushNtdQueue();
})();
</script>
