the toxic chemical into their lungs.", "Ensure caregivers wear gloves and protective clothing to avoid getting the toxic pesticide on their own skin."], "whenToSeeDoctor": ["Immediately. Organophosphate poisoning can trigger fatal respiratory failure within hours. Rush the person to the nearest clinic or hospital; they require immediate life-saving injections of Atropine."]}, {"name": "Peptic Ulcer Disease", "categories": ["Stomach/Intestines"], "symptoms": ["Upper abdominal pain"], "urgency": "Semi-Urgent", "whatIsIt": ["Painful sores or ulcers that develop on the interior lining of your stomach or the upper section of your small intestine, frequently caused by chronic H. pylori bacterial infections or excessive use of chemical painkillers."], "doIHaveIt": ["Do you suffer from a burning, gnawing stomach pain located in your upper abdomen between your navel and breastbone?", "Does this burning pain follow a strict pattern: worsening when your stomach is completely empty (such as in the middle of the night) and temporarily improving when you eat food or take an antacid?", "Are you plagued by frequent bloating, acid burping, and a feeling of nausea after completing normal meals?"], "whatShouldIDo": ["Stop Toxic Painkillers: Immediately cease taking NSAID pain medications (like Ibuprofen, Diclofenac, Naproxen, or Aspirin). These drugs actively block your stomach's ability to protect itself from its own acid, worsening ulcers.", "Avoid consuming alcohol, smoking tobacco, and eating highly acidic or heavily spiced foods, which directly irritate the raw ulcerated lining.", "Eat smaller, regular meals to keep a gentle coating of food in the stomach, preventing raw acid from burning the sores."], "whenToSeeDoctor": ["Visit a clinic to receive targeted acid-blocking medication and antibiotics. Seek immediate emergency care if you vomit dark brown fluid that looks like coffee grounds, pass solid black, tarry stools, or feel a sudden, agonizing tear in your upper abdomen."]}, {"name": "Peripheral Artery Disease", "categories": ["Cardiovascular"], "symptoms": ["Leg pain while walking (stops at rest)"], "urgency": "Semi-Urgent", "whatIsIt": ["A chronic circulatory condition where plaque builds up and narrows the arteries supplying blood to your limbs, typically affecting the legs.", "It starves leg muscles of oxygenated blood during movement."], "doIHaveIt": ["Do you experience a predictable, painful cramping or aching in your calves, thighs, or buttocks while walking or climbing stairs?", "Does this leg pain completely vanish within a few minutes of standing still and resting, only to return once you resume walking? (This pattern is called claudication).", "Has the skin on your lower legs become shiny and hairless, and are the pulses in your feet very faint or impossible to feel with your fingers?"], "whatShouldIDo": ["Do not sit still permanently: While walking causes temporary aching, regular, structured walking exercises (walking until the pain starts, resting, and walking again) actually forces your body to build new helper blood vessels over time.", "Stop Smoking Immediately: Smoking is the primary driver of artery narrowing and can lead to complete limb blockages.", "Inspect your feet daily for small cuts, blisters, or skin color changes; poor circulation slows down healing and increases the risk of foot ulcers."], "whenToSeeDoctor": ["Visit a health center if your leg pain begins striking you while you are resting in bed, or if a small cut or blister on your foot turns dark, cold, or refuses to heal over several weeks."]}, {"name": "Postpartum Hemorrhage", "categories": ["Maternal/Bleeding"], "symptoms": ["Heavy bleeding"], "urgency": "Resuscitation (Immediate)", "whatIsIt": ["Heavy, excessive bleeding from the uterus immediately or shortly following childbirth.", "It is the leading cause of maternal death globally and can result in fatal shock within minutes if home containment steps are not performed."], "doIHaveIt": ["Have you recently given birth, and are you experiencing a sudden, massive gush or continuous, heavy pouring of blood from your vagina?", "Are you soaking through more than two thick sanitary pads or cloths every 15 minutes, or are you passing massive, hand-sized blood clots?", "Are you feeling rapidly dizzy, lightheaded, breaking out into a cold sweat, or feeling like you are about to pass out?"], "whatShouldIDo": ["Perform Fundal Massage Instantly: If the uterus is soft and boggy, the mother or a caregiver must place a firm hand on the lower belly (just below the navel) and rub and massage it vigorously in a circular motion. This causes the uterus to contract and clamp down on bleeding vessels.", "Breastfeed Immediately: Putting the newborn to the breast triggers the natural release of oxytocin, which forcefully contracts the uterus to slow bleeding.", "Lie flat on your back and elevate your legs on blankets to keep blood flowing to your brain while help is sourced."], "whenToSeeDoctor": ["Immediately. Postpartum hemorrhage is an absolute emergency. Arrange immediate transport to a surgical or medical center while continuously massaging the lower abdomen and keeping the baby at the breast."]}, {"name": "Preeclampsia / Eclampsia", "categories": ["Muscular/Neurological", "Maternal/Bleeding", "Fluid/Metabolism Changes"], "symptoms": ["Sudden weakness/numbness on one side of body", "Seizures/convulsions", "High blood pressure during pregnancy", "Drastic decrease in urine output", "Swelling legs", "Puffy eyes"], "urgency": "Resuscitation (Immediate)", "whatIsIt": ["A dangerous, pregnancy-specific condition marked by a sudden spike in blood pressure and kidney distress, typically striking after the 20th week of pregnancy.", "If left unmanaged, it can transition into Eclampsia, causing life-threatening seizures and strokes."], "doIHaveIt": ["Are you pregnant (past 5 months) or have you recently given birth, and have you developed a severe, throbbing headache that does not improve with rest or Paracetamol?", "Are you experiencing sudden vision changes, such as seeing flashing lights, dark spots, or sudden blurriness?", "Have your face, hands, and eyelids become visibly, drastically swollen over a single day, and are you suffering from intense pain in your upper right abdomen?"], "whatShouldIDo": ["Understand that preeclampsia cannot be managed with lifestyle changes or home remedies at home; it requires medical evaluation to determine if early delivery or blood pressure stabilization is required.", "If a pregnant woman displays these signs, she must stop all physical work and rest completely while transport to a maternity clinic is arranged.", "If an individual progresses to Eclampsia (seizures), turn them onto their side, clear their immediate surroundings, and do not place anything in their mouth."], "whenToSeeDoctor": ["Seek emergency obstetric care immediately if you display severe headaches, vision changes, facial swelling, or upper stomach pain during pregnancy. A seizure requires immediate, life-saving intervention."]}, {"name": "Sarcoidosis", "categories": ["Whole Body/Systemic", "Respiratory/Chest"], "symptoms": ["Chronic fever", "Chronic shortness of breath", "Dry, hacking cough"], "urgency": "Semi-Urgent", "whatIsIt": ["An inflammatory disease characterized by the formation of tiny clumps of inflammatory cells (granulomas) in various organs, most commonly the lungs and lymph nodes.", "Its exact cause is unknown and it can mimic tuberculosis."], "doIHaveIt": ["Have you developed a persistent, dry, hacking cough accompanied by a gradual shortness of breath that has lingered for months without any signs of improvement?", "Are you experiencing a low fever, unexplained weight loss, and tender, reddish-purple bumps or lumps on your shins or ankles?", "Have you noticed painless, firm swellings (lymph nodes) appearing in your neck, armpits, or around your collarbone?"], "whatShouldIDo": ["Maintain a healthy lifestyle by avoiding exposure to lung irritants such as heavy dust, chemical fumes, and tobacco smoke.", "Engage in gentle, regular physical activity to help maintain your lung capacity and reduce joint stiffness.", "Keep an accurate written record of your symptoms, as sarcoidosis can naturally alternate between long periods of worsening flares and spontaneous clearing."], "whenToSeeDoctor": ["Visit a medical clinic for a chest X-ray and evaluation if you have a persistent cough and shortness of breath that mimics tuberculosis but fails to resolve, or if you develop painful, red skin nodules on your lower legs."]}, {"name": "Schistosomiasis", "categories": ["Whole Body/Systemic", "Stomach/Intestines"], "symptoms": ["Fatigue", "Pale skin/dizziness", "Lower abdominal pain", "Upper abdominal pain", "Swollen belly or liver/bladder issues"], "urgency": "Semi-Urgent", "whatIsIt": ["A parasitic worm infection common in rural, tropical areas.", "Microscopic worm larvae are released by freshwater snails into slow-moving water and burrow directly through the bare skin of humans during wading, washing, or farming."], "doIHaveIt": ["Do you regularly wash clothes, farm, swim, or wade in local, untreated freshwater lakes, rivers, or streams?", "Did you develop an intense, itchy, bumpy skin rash (\"swimmer's itch\") within hours or days of entering the water?", "Weeks later, did you develop a sudden fever, chills, a dry cough, and deep muscle aches?", "For Chronic Form: Have you noticed visible blood in your urine (often turning it pink or red), or are you suffering from a progressively swollen, fluid-filled stomach with abdominal pain?"], "whatShouldIDo": ["Avoid Contaminated Water: Stop bathing, swimming, or washing clothes in untreated surface water. If you must cross a river, wear tall rubber boots.", "If you are accidentally exposed to river water, dry your skin aggressively with a clean towel immediately to help rub away burrowing larvae before they break the skin.", "Understand that this infection is highly curable with a short, low-cost course of an oral medication called Praziquantel, often distributed in rural endemic health campaigns."], "whenToSeeDoctor": ["Visit a health post if you notice blood in your urine, chronic lower stomach pain, or develop a long-term fever after history of contact with open freshwater sources."]}, {"name": "Sickle Cell Disease", "categories": ["Whole Body/Systemic"], "symptoms": ["Fatigue", "Pale skin/dizziness"], "urgency": "Urgent", "whatIsIt": ["An inherited red blood cell disorder genetically linked to specific ethnic backgrounds (e.g., African, Mediterranean, Middle Eastern ancestry).", "It causes red blood cells to stiffen into rigid \"sickle\" shapes that block small blood vessels, causing sudden, agonizing tissue damage."], "doIHaveIt": ["Do you have a family history of blood disorders, and do you or your children suffer from sudden, excruciating episodes of deep bone, joint, or stomach pain? (Known as a pain crisis).", "Have your young children experienced sudden, painful, and symmetric swelling of their hands and feet?", "Are you constantly dealing with severe fatigue, pale inner eyelids, and a yellow tint in the whites of your eyes (jaundice)?"], "whatShouldIDo": ["Aggressive Fluid Intake: During a pain crisis, you must drink massive amounts of clean water. Hydration thins the blood and helps unclog sickled cells from blocked vessels.", "Maintain Warmth: Avoid sudden exposure to extreme cold or jumping into cold water, as cold temperatures cause blood vessels to clamp shut, instantly triggering a severe pain crisis.", "Manage pain at home with warm compresses and standard pain relievers, while keeping the individual resting comfortably."], "whenToSeeDoctor": ["Seek clinical care promptly for a pain crisis. Go to a hospital immediately if a sickle cell patient develops a sudden high fever, severe chest pain with shortness of breath (Acute Chest Syndrome), or displays signs of a stroke."]}, {"name": "Snake Envenomation", "categories": ["Respiratory/Chest", "Skin", "Maternal/Bleeding"], "symptoms": ["Sudden wheezing/tightness", "Bite site complications", "Bleeding from gums, nose, or wounds after a bite", "Heavy bleeding"], "urgency": "Resuscitation (Immediate)", "whatIsIt": ["A critical, fast-acting medical emergency caused by the injection of toxins through the bite of a venomous snake.", "It can destroy tissue, cause internal bleeding, or paralyse breathing muscles within hours."], "doIHaveIt": ["Have you been bitten by a snake, and can you see one or two distinct puncture wounds (fang marks) on your skin?", "Is the area around the bite site swelling rapidly, turning dark purple, and causing an intense, burning pain?", "Are you experiencing systemic signs: sudden dizziness, bleeding from your gums or nose, or a heavy drooping of your eyelids accompanied by difficulty swallowing?"], "whatShouldIDo": ["Keep the Bitten Limb Completely Immobilized: Keep the limb resting at or slightly below the level of the heart. Minimize all movement; running or walking pumps the venom through your lymphatic system much faster.", "Clean the bite gently with water. Do not cut the wound, do not attempt to suck out the venom, and do not apply a tight tourniquet. Cutting and suction cause deep tissue infections, and tight tourniquets trap venom, destroying the entire limb.", "Remove any tight rings, bracelets, or clothing from the limb before swelling expands."], "whenToSeeDoctor": ["Immediately. Every venomous snakebite is a race against time. Arrange immediate transport to a hospital or health post that stocks antivenom. Do not delay travel to seek traditional healers."]}, {"name": "Stroke (Hemorrhagic)", "categories": ["Muscular/Neurological"], "symptoms": ["Sudden weakness/numbness on one side of body", "Sudden confusion, slurred speech", "Pinpoint pupils"], "urgency": "Resuscitation (Immediate)", "whatIsIt": ["A highly lethal type of stroke caused by a blood vessel suddenly bursting inside the brain, causing blood to leak into the skull and create dangerous intracranial pressure.", "It is universally driven by severe, untreated high blood pressure."], "doIHaveIt": ["Did you suddenly develop the most severe, agonizing headache of your life, striking like a sudden clap of thunder out of nowhere?", "Is your explosive headache accompanied by immediate nausea, forceful vomiting, and a very stiff, painful neck?", "Did you or the patient suddenly lose consciousness, fall into a deep faint, or experience a sudden seizure right after the headache started?", "Are you experiencing sudden weakness on one side of your body, severe dizziness, or an inability to stand up?"], "whatShouldIDo": ["Strict Warning: NEVER give Aspirin, Ibuprofen, or any blood-thinning medication. These drugs prevent clotting and will accelerate the active, fatal bleeding inside the brain.", "Keep the person completely still. Lay them on their side if they are vomiting to prevent them from breathing fluid into their lungs.", "Loosen any tight clothing around their neck to help manage pressure, and keep the environment as quiet and calm as possible."], "whenToSeeDoctor": ["Immediately. A hemorrhagic stroke carries an exceptionally high risk of death within the first few hours. Treat a sudden \"thunderclap\" headache with neurological weakness as a top-tier emergency and transport them to a hospital instantly."]}, {"name": "Stroke (Ischemic)", "categories": ["Muscular/Neurological"], "symptoms": ["Sudden weakness/numbness on one side of body", "Sudden confusion, slurred speech"], "urgency": "Resuscitation (Immediate)", "whatIsIt": ["The most common type of stroke, occurring when a blood clot blocks a narrowed artery supplying blood to the brain, starving brain cells of oxygen.", "It is heavily tied to unmanaged chronic hypertension and lack of preventative cardiovascular screenings."], "doIHaveIt": ["Did you experience a sudden, painless weakness or total numbness on just one side of your body (such as your left arm and left leg suddenly giving out)?", "When you try to smile in the mirror, does one side of your mouth droop down or refuse to move?", "Are you suddenly finding it difficult to speak, slurring your words, or unable to understand what someone right next to you is saying?", "Have you suddenly lost vision or developed blurry, double vision in one or both eyes out of nowhere?"], "whatShouldIDo": ["Do not give the person anything to eat or drink. A stroke can paralyze throat muscles, making swallowing highly dangerous and causing choking.", "Do not give Aspirin at home unless a scan has proven it is an ischemic stroke. If it turns out to be a bleeding stroke instead, Aspirin will make it far more lethal.", "Lay the person flat on their side (recovery position) to keep their airway completely clear. Note the exact time the first symptom started."], "whenToSeeDoctor": ["Immediately. An ischemic stroke is a time-critical emergency. Every minute wasted means millions of brain cells die. Rush to the nearest hospital right away."]}, {"name": "Trachoma", "categories": ["Vision/Eyes"], "symptoms": ["Sudden eye pain", "Chronic redness"], "urgency": "Semi-Urgent", "whatIsIt": ["A highly contagious bacterial eye infection spread by contact with eye discharge from infected people or via eye-seeking flies in overcrowded, water-scarce rural areas.", "Repeated infections lead to severe scarring of the inner eyelid."], "doIHaveIt": ["Do you live in an area with limited water access, and have you or your children suffered from recurring eye redness, itching, and mild discharge for months?", "When you look closely, does the inside of the upper eyelid feel rough, bumpy, and severely scarred?", "Have your eyelashes turned inward (trichiasis), causing them to scratch directly against your clear eyeball every time you blink?"], "whatShouldIDo": ["Enforce Face Washing: Aggressively wash your face and your children's faces with clean water and soap multiple times a day to wash away infective secretions and deter flies.", "Improve community sanitation by disposing of animal waste away from living quarters to drastically reduce eye-seeking fly populations.", "Understand that early infections are fully cured with a simple dose of low-cost antibiotics (like oral Azithromycin) available at local health clinics."], "whenToSeeDoctor": ["Visit a health facility if your eyelashes begin turning inward or scratching your eye. A simple, low-cost minor eyelid procedure can slide the lashes back outward, preventing permanent blindness from corneal scratching."]}, {"name": "Traumatic Hemorrhage", "categories": ["Maternal/Bleeding"], "symptoms": ["Heavy bleeding"], "urgency": "Resuscitation (Immediate)", "whatIsIt": ["Massive, uncontained external blood loss caused by a severe injury, deep cut, or physical trauma to major blood vessels.", "If blood loss is not halted immediately at home, death from hemorrhagic shock occurs in minutes."], "doIHaveIt": ["Have you sustained an injury, and is blood actively spurting or continuously pouring in large volumes from the wound?", "Is the blood pooling rapidly on the ground or fully soaking through your clothing and cloths within seconds?", "Is the injured individual turning pale, shivering, breathing rapidly, and starting to lose consciousness?"], "whatShouldIDo": ["Apply Direct, Constant Pressure Instantly: Place a clean cloth, towel, or your bare hands directly over the wound and press down as hard as you can without stopping. Do not lift the cloth to check if the bleeding has stopped; continuous pressure is what allows clots to form.", "Elevate: If the wound is on an arm or leg, keep it raised high above the level of the heart while maintaining constant manual pressure.", "If blood leaks through your initial cloth, do not remove it. Place a second cloth directly on top of it and press harder."], "whenToSeeDoctor": ["Immediately. Maintain heavy, direct manual pressure on the wound while transporting the injured person to the nearest clinic or surgical center. Never release pressure until a medical professional takes over."]}, {"name": "Triple-Negative Breast Cancer", "categories": ["Whole Body/Systemic", "Skin"], "symptoms": ["Fatigue", "Unexplained weight loss", "Painless neck or armpit lumps", "Hard painless lump in breast"], "urgency": "Resuscitation (Immediate)", "whatIsIt": ["An aggressive, fast-growing subtype of breast cancer that lacks the three common receptors that fuel most breast cancers.", "It disproportionately affects Black women, tends to spread quickly, and requires urgent identification."], "doIHaveIt": ["Have you discovered a firm, hard, completely painless lump in your breast that appeared suddenly and has grown noticeably larger in just a few weeks?", "Has the skin over your breast rapidly developed an unusual red, swollen, or warm appearance that looks like an infection but fails to improve with skin creams?", "Have you noticed a new, painful swelling or hard knot deep inside your armpit or along your collarbone?"], "whatShouldIDo": ["Be aware that because this cancer lacks standard receptors, it cannot be treated with common hormonal therapies. It responds best to fast surgical intervention and chemotherapy.", "Do not delay seeking care to try traditional herbal compresses or dietary changes; this specific cancer variant grows too aggressively for delayed action."], "whenToSeeDoctor": ["Schedule an urgent clinical evaluation the moment you notice any rapid-growing, firm lump in your breast tissue or armpit. Early diagnosis is the most vital factor for successful treatment."]}, {"name": "Tuberculosis (Pulmonary)", "categories": ["Whole Body/Systemic", "Respiratory/Chest"], "symptoms": ["High, sudden fever", "Cough or rapid breathing", "Fatigue", "Unexplained weight loss", "Cough w/ phlegm or blood"], "urgency": "Urgent", "whatIsIt": ["A highly contagious bacterial infection of the lungs spread through tiny airborne droplets when an infected person coughs or sneezes.", "It is highly prevalent in areas with overcrowding, poverty, or high rates of HIV."], "doIHaveIt": ["Have you been suffering from a persistent, heavy cough that has lasted for more than three consecutive weeks?", "Does your cough frequently bring up thick phlegm mixed with visible streaks of red blood?", "Are your chronic coughs accompanied by a low-grade fever, severe drenching sweats at night, and a dramatic, unintended loss of body weight?"], "whatShouldIDo": ["Airborne Isolation: Sleep in a separate room with windows left wide open to ensure constant ventilation, which helps clear floating bacteria from the air. Wear a mask when near family.", "Always cover your mouth and nose fully with your elbow or a cloth when coughing or sneezing, and dispose of phlegm rags safely.", "Commit to completing your full 6-month course of prescribed TB antibiotics exactly as directed, even if you feel completely healthy after month two. Stopping early causes dangerous drug-resistant strains."], "whenToSeeDoctor": ["Visit a health post or tuberculosis center immediately for a sputum (phlegm) test if you have a cough lasting over 3 weeks, night sweats, or are coughing up blood."]}, {"name": "Tuberculosis (Zoonotic)", "categories": ["Whole Body/Systemic", "Respiratory/Chest"], "symptoms": ["Chronic fever", "Fatigue", "Unexplained weight loss", "Cough w/ phlegm or blood"], "urgency": "Urgent", "whatIsIt": ["A variant of tuberculosis caused by a bacterium (Mycobacterium bovis) passed from infected cattle to humans.", "It is primarily spread through the consumption of raw, unpasteurized milk or close contact with livestock.", "Unlike standard TB, it frequently infects organs outside the lungs, such as the gut or lymph nodes."], "doIHaveIt": ["Do you live in a rural or farming area and regularly consume unpasteurized (raw) milk, cheese, or herd livestock?", "Have you developed firm, painless, swollen lumps (lymph nodes) in your neck that slowly grow over weeks, sometimes breaking through the skin to leak fluid?", "Are you suffering from long-term, unexplained stomach pain, chronic diarrhea, progressive weight loss, and a low-grade fever with night sweats?", "(If lung-involved): Have you had a persistent cough for more than 3 weeks that is completely unresponsive to standard cough medicines?"], "whatShouldIDo": ["Boil Your Milk: Always boil raw milk before drinking it or using it to make dairy products. High heat completely kills the bacterium.", "Keep the patient's towels and utensils separate, and ensure any leaking skin sores are kept covered with clean dressings.", "Understand that this condition cannot be treated with standard over-the-counter antibiotics; it requires a specialized, strict multi-month regimen of prescription anti-TB medications."], "whenToSeeDoctor": ["Visit a health clinic if you develop chronic, unresolving neck swellings, persistent stomach pain, or a long-term cough, especially if you have a history of drinking raw milk or working with sick cattle."]}, {"name": "Type 2 Diabetes", "categories": ["Whole Body/Systemic", "Cardiovascular", "Vision/Eyes", "Fluid/Metabolism Changes"], "symptoms": ["Fatigue", "Unexplained weight loss", "Leg pain while walking (stops at rest)", "Cloudy/blurry vision", "Extreme dehydration, constant hunger"], "urgency": "Semi-Urgent", "whatIsIt": ["A chronic metabolic disease where your body becomes resistant to insulin, causing dangerous amounts of sugar to build up in your blood.", "Over time, high blood sugar destroys your eyes, kidneys, nerves, and heart."], "doIHaveIt": ["Are you plagued by an unquenchable, constant thirst that forces you to drink liters of water daily, combined with a need to urinate every hour, especially at night?", "Are you experiencing a constant, intense hunger and sudden weight loss, despite eating far more food than usual?", "Have you noticed a complete loss of feeling or a persistent \"pins and needles\" numbness in your feet, or are small cuts on your legs taking weeks to heal?"], "whatShouldIDo": ["Radical Dietary Shift: Cut out all refined sugars, sweet sodas, candies, and white bread from your daily diet. Focus on high-fiber vegetables, whole grains, and beans, which prevent blood sugar spikes.", "Daily Foot Care: Check the bottoms of both feet every single day for tiny cuts or blisters. Because diabetes numbs nerve endings, you can step on a sharp object, get an infection, and never feel it.", "Engage in regular physical work or walking to help your muscles burn off excess blood sugar naturally."], "whenToSeeDoctor": ["Visit a health center for a simple finger-prick blood sugar test if you suffer from extreme thirst, frequent urination, or non-healing foot sores. Seek emergency care if you become deeply confused or start breathing rapidly and deeply (signs of diabetic ketoacidosis)."]}, {"name": "Typhoid Fever", "categories": ["Whole Body/Systemic", "Muscular/Neurological"], "symptoms": ["High, sudden fever", "Severe headache/body aches", "Sudden confusion, slurred speech"], "urgency": "Emergency (Very Urgent)", "whatIsIt": ["A life-threatening bacterial infection caused by consuming food or water contaminated with salmonella bacteria from human waste.", "It multiplies in the bloodstream and can cause severe intestinal tearing and bleeding."], "doIHaveIt": ["Are you suffering from a slowly rising, high fever that gets progressively hotter each day, reaching an intense peak?", "Is your high fever accompanied by a very slow heart rate, an intense headache, a dry cough, and extreme weakness?", "Do you have severe stomach pain with either severe constipation or watery green diarrhea, occasionally accompanied by faint pink spots on your chest?"], "whatShouldIDo": ["Strict Fluid Therapy: Maintain continuous hydration with clean, boiled water or ORS to replace fluid lost to high fever and gastrointestinal issues.", "Rigorous Sanitation: The patient must wash hands with soap after using the toilet, and their food must be prepared separately to avoid spreading the bacteria to the rest of the household.", "Understand that typhoid requires target antibiotic treatment from a clinic to clear the bacteria from your system safely."], "whenToSeeDoctor": ["Seek clinical care immediately for antibiotic therapy. If a typhoid patient develops a sudden, severe worsening of abdominal pain, begins vomiting blood, or lapses into a state of extreme delirium or confusion, treat it as a critical surgical emergency."]}, {"name": "Vitamin A Deficiency", "categories": ["Vision/Eyes"], "symptoms": ["Night blindness"], "urgency": "Non-Urgent", "whatIsIt": ["A severe nutritional deficiency caused by a lack of vitamin A-rich foods in the diet.", "It is a massive cause of preventable childhood blindness and immune collapse in low-development regions."], "doIHaveIt": ["Do you or your children suffer from night blindness, meaning you can see perfectly fine during bright daylight, but become completely blind as soon as the sun sets or you enter a dim room?", "Are the whites of your eyes looking extremely dry, wrinkled, or dull, and have you noticed small, triangular, foamy gray spots forming on them? (Known as Bitot's spots).", "Are your young children suffering from constant, dry, scaly skin and catching severe diarrhea or respiratory infections far more frequently than other kids?"], "whatShouldIDo": ["Dietary Enrichment: Immediately increase your consumption of foods rich in Vitamin A: dark leafy greens, orange fruits and vegetables (carrots, sweet potatoes, pumpkins, papayas), eggs, and fish liver oils.", "Encourage long-term breastfeeding for infants, as breastmilk is a vital natural source of Vitamin A for developing babies.", "Participate in local child health days, where health posts distribute free high-dose Vitamin A capsules twice a year to children under five."], "whenToSeeDoctor": ["Visit a health post if a child displays any signs of night blindness or severe eye dryness. Correcting this deficiency early prevents the cornea from softening and causing irreversible, total blindness."]}, {"name": "Yellow Fever", "categories": ["Whole Body/Systemic", "Stomach/Intestines", "Skin", "Maternal/Bleeding"], "symptoms": ["High, sudden fever", "Severe headache/body aches", "Upper abdominal pain", "Swollen belly or liver/bladder issues", "Yellowing of skin/eyes", "Bleeding from gums, nose, or wounds after a bite"], "urgency": "Emergency (Very Urgent)", "whatIsIt": ["A severe, mosquito-borne viral hemorrhagic fever found in tropical regions of Africa and South America.", "It damages liver tissue, causes sudden internal bleeding, and carries a high mortality rate once advanced."], "doIHaveIt": ["Did you suddenly develop a high fever, severe chills, an intense backache, and generalized muscle pain that makes you feel utterly incapacitated?", "After temporarily feeling better for a day, has your fever returned with a vengeance, accompanied by a striking yellowing of your skin and eyes (jaundice)?", "Are you experiencing severe abdominal pain and beginning to vomit dark, altered blood (\"black vomit\") or bleed from your nose and gums?"], "whatShouldIDo": ["Do NOT take Aspirin or Ibuprofen, which increase your risk of severe internal bleeding. Only use Paracetamol.", "Keep the patient resting comfortably under a mosquito net during the day to prevent local mosquitoes from biting them and spreading the virus to neighbors.", "Drink oral rehydration solutions continuously to fight dehydration caused by persistent vomiting and high fever."], "whenToSeeDoctor": ["Seek immediate hospital care if a fever returns accompanied by yellow skin, dark urine, or spontaneous bleeding."]}];

  const CATEGORY_ORDER = [
    "Whole Body/Systemic",
    "Respiratory/Chest",
    "Cardiovascular",
    "Stomach/Intestines",
    "Skin",
    "Vision/Eyes",
    "Muscular/Neurological",
    "Maternal/Bleeding",
    "Fluid/Metabolism Changes"
  ];

  const URGENCY_RANK = {
    "Resuscitation (Immediate)": 0,
    "Emergency (Very Urgent)": 1,
    "Urgent": 2,
    "Semi-Urgent": 3,
    "Non-Urgent": 4
  };

  const URGENCY_CLASS = {
    "Resuscitation (Immediate)": "urgency-resuscitation",
    "Emergency (Very Urgent)": "urgency-emergency",
    "Urgent": "urgency-urgent",
    "Semi-Urgent": "urgency-semi",
    "Non-Urgent": "urgency-non"
  };

  let selectedCategories = new Set();
  let selectedSymptoms = new Set();

  const stepCategoryEl = document.getElementById("mck-step-category");
  const stepSymptomEl = document.getElementById("mck-step-symptom");
  const stepResultsEl = document.getElementById("mck-step-results");

  function showStep(step){
    stepCategoryEl.style.display = step === "category" ? "" : "none";
    stepSymptomEl.style.display = step === "symptom" ? "" : "none";
    stepResultsEl.style.display = step === "results" ? "" : "none";
    document.getElementById("mck-root").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function renderCategoryStep(){
    let html = `
      <p class="step-label">Step 1 of 3</p>
      <p class="step-instructions">Select every area that applies. You can select more than one, and tap again to deselect.</p>
      <div class="chip-group" id="mck-category-chips"></div>
      <div class="actions">
        <button class="btn primary" id="mck-to-symptoms" disabled>Next: choose symptoms</button>
      </div>
    `;
    stepCategoryEl.innerHTML = html;

    const chipGroup = document.getElementById("mck-category-chips");
    CATEGORY_ORDER.forEach(cat => {
      const chip = document.createElement("button");
      chip.className = "chip";
      chip.textContent = cat;
      chip.addEventListener("click", () => {
        if(selectedCategories.has(cat)){
          selectedCategories.delete(cat);
          chip.classList.remove("selected");
        } else {
          selectedCategories.add(cat);
          chip.classList.add("selected");
        }
        document.getElementById("mck-to-symptoms").disabled = selectedCategories.size === 0;
      });
      chipGroup.appendChild(chip);
    });

    document.getElementById("mck-to-symptoms").addEventListener("click", () => {
      renderSymptomStep();
      showStep("symptom");
    });
  }

  function renderSymptomStep(){
    let html = `
      <p class="step-label">Step 2 of 3</p>
      <p class="step-instructions">Select every symptom that applies. Tap again to deselect.</p>
    `;

    CATEGORY_ORDER.filter(c => selectedCategories.has(c)).forEach(cat => {
      html += `
        <div class="symptom-group">
          <p class="symptom-group-title">${cat}</p>
          <div class="chip-group" data-category="${cat}"></div>
        </div>
      `;
    });

    html += `
      <div class="actions">
        <button class="btn" id="mck-back-to-categories">Back</button>
        <button class="btn primary" id="mck-to-results" disabled>See results</button>
      </div>
    `;

    stepSymptomEl.innerHTML = html;

    CATEGORY_ORDER.filter(c => selectedCategories.has(c)).forEach(cat => {
      const group = stepSymptomEl.querySelector(`.chip-group[data-category="${CSS.escape(cat)}"]`);
      TAXONOMY[cat].forEach(sym => {
        const chip = document.createElement("button");
        chip.className = "chip";
        if(selectedSymptoms.has(sym)) chip.classList.add("selected");
        chip.textContent = sym;
        chip.addEventListener("click", () => {
          if(selectedSymptoms.has(sym)){
            selectedSymptoms.delete(sym);
            chip.classList.remove("selected");
          } else {
            selectedSymptoms.add(sym);
            chip.classList.add("selected");
          }
          document.getElementById("mck-to-results").disabled = selectedSymptoms.size === 0;
        });
        group.appendChild(chip);
      });
    });

    document.getElementById("mck-to-results").disabled = selectedSymptoms.size === 0;

    document.getElementById("mck-back-to-categories").addEventListener("click", () => {
      showStep("category");
    });

    document.getElementById("mck-to-results").addEventListener("click", () => {
      renderResultsStep();
      showStep("results");
    });
  }

  function paragraphsHtml(paragraphs){
    return paragraphs.map(p => `<p>${escapeHtml(p)}</p>`).join("");
  }

  function listHtml(items){
    return `<ul>${items.map(i => `<li>${escapeHtml(i)}</li>`).join("")}</ul>`;
  }

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function renderResultsStep(){
    const matches = RECORDS.map(r => {
      const matchCount = r.symptoms.filter(s => selectedSymptoms.has(s)).length;
      return { record: r, matchCount };
    }).filter(m => m.matchCount > 0);

    matches.sort((a, b) => {
      if(b.matchCount !== a.matchCount) return b.matchCount - a.matchCount;
      const rankA = URGENCY_RANK[a.record.urgency] ?? 99;
      const rankB = URGENCY_RANK[b.record.urgency] ?? 99;
      if(rankA !== rankB) return rankA - rankB;
      return a.record.name.localeCompare(b.record.name);
    });

    let html = `
      <p class="step-label">Step 3 of 3</p>
      <p class="results-summary">${matches.length} possible match${matches.length === 1 ? "" : "es"} based on ${selectedSymptoms.size} selected symptom${selectedSymptoms.size === 1 ? "" : "s"}, sorted by closest match and urgency.</p>
    `;

    if(matches.length === 0){
      html += `<div class="no-results">No conditions in this list matched your selected symptoms. This doesn't rule anything out — if you're concerned, please check with a health worker or doctor.</div>`;
    } else {
      matches.forEach(m => {
        const r = m.record;
        const urgencyClass = URGENCY_CLASS[r.urgency] || "urgency-non";
        const matchedNames = r.symptoms.filter(s => selectedSymptoms.has(s));
        html += `
          <div class="result-card">
            <div class="result-head">
              <p class="result-name">${escapeHtml(r.name)}</p>
              <span class="urgency-pill ${urgencyClass}">${escapeHtml(r.urgency)}</span>
            </div>
            <p class="match-tag">Matches ${m.matchCount} of ${r.symptoms.length} listed symptoms: ${matchedNames.map(escapeHtml).join(", ")}</p>

            <details>
              <summary>What is it?</summary>
              <div class="section-body">${paragraphsHtml(r.whatIsIt)}</div>
            </details>

            <details>
              <summary>Do I have it?</summary>
              <div class="section-body">${listHtml(r.doIHaveIt)}</div>
            </details>

            <details>
              <summary>What should I do?</summary>
              <div class="section-body">${listHtml(r.whatShouldIDo)}</div>
            </details>

            <details>
              <summary>When to see a doctor?</summary>
              <div class="section-body">${paragraphsHtml(r.whenToSeeDoctor)}</div>
            </details>
          </div>
        `;
      });
    }

    html += `
      <div class="actions">
        <button class="btn" id="mck-back-to-symptoms">Back</button>
        <button class="btn" id="mck-start-over">Start over</button>
        <span class="save-note" id="mck-save-note"></span>
      </div>
    `;

    stepResultsEl.innerHTML = html;

    document.getElementById("mck-back-to-symptoms").addEventListener("click", () => {
      renderSymptomStep();
      showStep("symptom");
    });

    document.getElementById("mck-start-over").addEventListener("click", resetAll);

    saveToDatabase(matches);
  }

  function saveToDatabase(matches){
    const payload = {
      categories: Array.from(selectedCategories),
      symptoms: Array.from(selectedSymptoms),
      matches: matches.map(m => ({ name: m.record.name, urgency: m.record.urgency, matchCount: m.matchCount })),
      timestamp: new Date().toISOString()
    };

    const noteEl = document.getElementById("mck-save-note");

    // Hook point: this calls into Bubble via the Toolbox plugin's
    // bubble_fn_ bridge. Define bubble_fn_saveSelfCheck in a Bubble
    // workflow ("An external JavaScript action is called") to receive
    // this payload and create a database record from it.
    if(typeof bubble_fn_saveSelfCheck === "function"){
      try{
        bubble_fn_saveSelfCheck(JSON.stringify(payload));
        if(noteEl) noteEl.textContent = "Saved.";
      } catch(err){
        if(noteEl) noteEl.textContent = "Could not save automatically.";
      }
    }
  }

  function resetAll(){
    selectedCategories = new Set();
    selectedSymptoms = new Set();
    renderCategoryStep();
    showStep("category");
  }

  renderCategoryStep();
  showStep("category");
})();
</script>

<script src="./register-sw.js"></script>
</body>
</html>
