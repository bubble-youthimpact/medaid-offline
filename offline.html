<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're offline</title>
<link rel="stylesheet" href="./fonts/fonts.css">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#156569">
<style>
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#F6F4EE;
    color:#2B2A28;
    font-family:'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding:24px;
    text-align:center;
  }
  .box{ max-width:340px; }
  h1{ font-size:20px; margin:0 0 8px; }
  p{ font-size:14px; color:#63605A; margin:0 0 20px; }
  a{
    display:inline-block;
    background:#156569;
    color:#fff;
    text-decoration:none;
    font-size:14px;
    padding:10px 18px;
    border-radius:10px;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>This page hasn't been saved yet</h1>
    <p>You're offline, and this specific page hasn't been opened on this device before, so it can't load right now. Reconnect once to let it cache, and it'll work offline after that.</p>
    <a href="./index.html">Back to Home</a>
  </div>
</body>
</html>
